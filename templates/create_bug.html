{% extends "base.html" %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow-sm">

            <div class="card-body p-4">

                <h2 class="mb-4">

                    Report a New Bug 🐛

                </h2>


                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">

                            Bug Title

                        </label>


                        <input
                            type="text"
                            name="title"
                            class="form-control"
                            placeholder="Enter bug title"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">

                            Description

                        </label>


                        <textarea
                            name="description"
                            class="form-control"
                            rows="6"
                            placeholder="Describe the bug in detail"
                            required
                        ></textarea>

                    </div>


                    <div class="mb-4">

                        <label class="form-label">

                            Priority

                        </label>


                        <select
                            name="priority"
                            class="form-select"
                        >

                            <option value="Low">
                                Low
                            </option>


                            <option
                                value="Medium"
                                selected
                            >
                                Medium
                            </option>


                            <option value="High">
                                High
                            </option>


                            <option value="Critical">
                                Critical
                            </option>

                        </select>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Submit Bug
                    </button>


                    <a
                        href="{{ url_for('main.dashboard') }}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
