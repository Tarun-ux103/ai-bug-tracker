{% extends "base.html" %}


{% block title %}
Original Code
{% endblock %}


{% block content %}

<div class="container">


    <div class="page-header">

        <div>

            <h1>
                Original Source Code
            </h1>

            <p>
                Analysis: {{ report.title }}
            </p>

            <p>
                Language: {{ report.language }}
            </p>

        </div>


        <a
            href="{{ url_for(
                'analyzer.analysis_results',
                report_id=report.id
            ) }}"
            class="btn"
        >

            ← Back to Analysis

        </a>

    </div>


    <div class="analysis-summary">

        <h2>
            Source Code
        </h2>


        <pre><code>{{ report.source_code }}</code></pre>

    </div>


</div>

{% endblock %}
