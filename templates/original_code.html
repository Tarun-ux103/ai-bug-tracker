{% extends "base.html" %}


{% block page_title %}
Original Source Code
{% endblock %}


{% block content %}


<div class="d-flex justify-content-between align-items-center mb-4">


    <div>

        <h1>
            Original Source Code
        </h1>


        <p class="text-muted">

            <strong>
                Analysis:
            </strong>

            {{ report.title }}

            |

            <strong>
                Language:
            </strong>

            {{ report.language }}

        </p>


    </div>


    <a
        href="{{ url_for('main.dashboard') }}"
        class="btn btn-secondary"
    >

        ← Back to Dashboard

    </a>


</div>


<div class="card shadow-sm">


    <div class="card-body p-4">


        <h5 class="mb-3">
            Analyzed Source Code
        </h5>


        <pre><code>{{ report.source_code }}</code></pre>


    </div>


</div>


{% endblock %}
