{% extends "base.html" %}


{% block page_title %}
Create Account
{% endblock %}


{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-header">

            <div class="auth-icon">
                🐛
            </div>

            <h2>Create your account</h2>

            <p>
                Join BugMind AI and start analyzing code.
            </p>

        </div>


        <form method="POST">


            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-button"
            >
                Create Account
            </button>


        </form>


        <p class="auth-footer">

            Already have an account?

            <a
                href="{{ url_for('auth.login') }}"
            >
                Sign in
            </a>

        </p>

    </div>

</div>

{% endblock %}
