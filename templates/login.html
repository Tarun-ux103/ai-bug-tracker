{% extends "base.html" %}


{% block page_title %}
Sign In
{% endblock %}


{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-header">

            <div class="auth-icon">
                🔐
            </div>

            <h2>Welcome back</h2>

            <p>
                Sign in to manage and analyze your bugs.
            </p>

        </div>


        <form method="POST">


            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-button"
            >
                Sign In
            </button>


        </form>


        <p class="auth-footer">

            Don't have an account?

            <a
                href="{{ url_for('auth.register') }}"
            >
                Create Account
            </a>

        </p>

    </div>

</div>

{% endblock %}
