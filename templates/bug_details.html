{% extends "base.html" %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-9">


        <div
            class="d-flex
            justify-content-between
            align-items-center
            mb-4"
        >

            <div>

                <h1>
                    {{ bug.title }}
                </h1>


                <p class="text-muted">

                    Bug ID:
                    #{{ bug.id }}

                </p>

            </div>


            <a
                href="{{ url_for('main.dashboard') }}"
                class="btn btn-secondary"
            >
                ← Back to Dashboard
            </a>

        </div>


        <div class="card shadow-sm">

            <div class="card-body p-4">


                <div class="mb-4">

                    <h5>
                        Description
                    </h5>


                    <p>

                        {{ bug.description }}

                    </p>

                </div>


                <div class="row">


                    <div class="col-md-4 mb-3">

                        <h6>
                            Priority
                        </h6>


                        <span class="badge bg-primary">

                            {{ bug.priority }}

                        </span>

                    </div>


                    <div class="col-md-4 mb-3">

                        <h6>
                            Status
                        </h6>


                        <span class="badge bg-success">

                            {{ bug.status }}

                        </span>

                    </div>


                    <div class="col-md-4 mb-3">

                        <h6>
                            Created
                        </h6>


                        <p>

                            {{ bug.created_at.strftime('%d %b %Y') }}

                        </p>

                    </div>


                </div>


                <hr>


                <div class="d-flex gap-2">


                    <a
                        href="{{ url_for('main.edit_bug', bug_id=bug.id) }}"
                        class="btn btn-warning"
                    >
                        Edit Bug
                    </a>


                    <form
                        action="{{ url_for('main.delete_bug', bug_id=bug.id) }}"
                        method="POST"
                        onsubmit="return confirm('Are you sure you want to delete this bug?');"
                    >

                        <button
                            type="submit"
                            class="btn btn-danger"
                        >
                            Delete Bug
                        </button>

                    </form>


                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
